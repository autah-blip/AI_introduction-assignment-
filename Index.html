<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mini E-Learning Platform</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Mini E-Learning Platform</h1>
  </header>

  <main>
    <section id="course-list">
      <h2>Courses</h2>
      <ul id="courses"></ul>
    </section>

    <section id="course-details" class="hidden">
      <h2 id="course-title"></h2>
      <p id="course-description"></p>
      <ul id="course-lessons"></ul>
      <button id="complete-button">Mark as Completed</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Mini E-Learning Platform</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
